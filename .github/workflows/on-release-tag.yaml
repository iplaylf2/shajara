name: Publish on Release Tag

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          registry-url: https://registry.npmjs.org
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Parse release version
        id: release
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Validate package versions
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          yarn workspaces foreach -A exec node -e "const p=require('./package.json'); if (p.publishConfig && p.version) console.log(p.name + ' ' + p.version)" > publishable-versions.txt

          if awk -v expected="${RELEASE_VERSION}" '$2 != expected { exit 1 }' publishable-versions.txt; then
            exit 0
          fi

          {
            echo "::error::Release tag v${RELEASE_VERSION} does not match committed publishable package versions:"
            cat publishable-versions.txt
          } >&2
          exit 1

      - name: Publish workspaces
        run: yarn workspaces foreach -A --no-private -t npm publish --access public
